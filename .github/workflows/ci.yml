# Continuous integration.
#
# NOT aleogr/pipeline. The organisation's shared workflows are Go — ci-go.yml,
# cd-go.yml and eight composite actions, all named for it — and there is no Go
# here. What this repository has instead is four suites of its own, and CI's job
# is to run them on every pull request rather than trust that whoever pushed had
# a browser open.
#
# TWO JOBS, because they cost different things. The checks below are node and
# nothing else, and they finish in seconds. The suites drive a real Chromium
# against a real page, which is the only way most of what this repository does
# can be checked at all — and which needs a browser downloaded and a server
# running. Splitting them means the cheap answer does not wait for the
# expensive one.

name: Continuous Integration

# Also on main, and that is not symmetry for its own sake: the bundle the first
# job builds is uploaded as an artefact, so every commit on main leaves a
# downloadable portal-student.html behind. Getting the current single file stops
# being something anyone has to ask a person for.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      # txt() returns its argument when the dictionary has no entry, so a
      # missing translation shows English and nothing throws. This is the only
      # thing that sees it.
      - name: Nothing on screen is stuck in English
        run: node tools/i18n/check.mjs

      # It refuses rather than exports when a course dictionary has drifted out
      # of step with the catalogue, or when a lesson would reach `ingest` in a
      # shape it rejects. Both are invisible in a diff, and the second one
      # arrives as a constraint violation halfway through a mirror.
      - name: The backend's snapshot still builds
        run: node tools/snapshot/snapshot.js > /dev/null

      - name: The version is readable, and is a version
        run: |
          set -euo pipefail
          v="$(node tools/version/version.js --check)"
          echo "version: $v"
          case "$v" in
            dev|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "the version is neither a semantic version nor \"dev\""; exit 1 ;;
          esac

      - name: The single-file portal still builds
        run: python3 tools/bundle/bundle.py

      # The point of keeping it. On a pull request it is the change, openable
      # before merging; on main it is the current portal in one file. 30 days,
      # because a tagged release keeps its own copy for good and this one only
      # has to outlive the reason somebody wanted it.
      - name: Keep the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-student-html
          path: portal-student.html
          retention-days: 30

  Browser:
    runs-on: ubuntu-latest
    # 30 and not 20. The suites need about eight minutes together; the rest was
    # always the browser install, and 20 left so little room that a slow mirror
    # cut the run off mid-setup. If this cap is ever reached again with the
    # cache warm, the answer is the official Playwright container image, which
    # carries the browser and its libraries — and would need python3 added to
    # it, because bundle.py and the two http.server processes below are python.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      # Chromium only. The suites drive one browser and pulling three would
      # treble the slowest step of this workflow for nothing.
      #
      # `--with-deps` IS GONE, AND THAT IS WHERE THE TIME WENT. It runs
      # `apt-get update` and an install on every single run, and when the
      # runner's Ubuntu mirror is slow — which happens, and did — that step
      # alone took 16 minutes. The job cap is below, and it killed the run
      # before one suite had started: a network hiccup arriving as "CI failed"
      # with nothing to read.
      #
      # It is not needed here. The ubuntu-latest image already carries the
      # libraries Chromium wants; it ships Chrome and Firefox preinstalled.
      # A bare container would be a different answer — see the note on the cap.
      #
      # THE DOWNLOAD IS CACHED, keyed by the version npm resolves rather than a
      # fixed string: `playwright` is deliberately unpinned here, so a constant
      # key would hand a stale browser to a newer library and fail in ways that
      # look like the suites' fault.
      - name: Install the Playwright library
        env:
          # Without this the postinstall fetches browsers before the cache is
          # restored, which is the download the cache exists to avoid.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save playwright
          echo "PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"

      - name: Restore Chromium
        id: chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Download Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The suites fetch the page over HTTP because that is how a student gets
      # it; the ports are the ones the suites default to.
      - name: Serve the portal
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/index.html >/dev/null && \
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done

      # THE BUNDLE IS OPENED, not merely built. The Checks job builds it and
      # uploads it, and until now nothing ever loaded the result — so a bundle
      # that threw before its first paint passed every run, which is exactly
      # what happened when app/main.js gained a top-level `await`.
      #
      # Built again here rather than carried between jobs: it is a python script
      # over files already checked out, and the artifact plumbing would cost
      # more to read than the two seconds it saves.
      - name: The single-file portal opens
        run: |
          python3 tools/bundle/bundle.py
          node tools/bundle/boot.mjs

      # The `example` blocks are executable programs with their output written
      # beside them. This runs them and compares.
      - name: The code examples really do run
        run: node tools/examples/check.mjs

      - name: The whole portal, in a browser
        run: node tools/smoke/smoke.mjs

      # Seeds a real browser with a pre-rename document and reloads: the storage
      # migrations only run once per visitor, so a broken one is invisible until
      # it has already reset somebody.
      - name: A returning student's data survives the renames
        run: node tools/migration/check.mjs

      # Every suite above runs with no backend, where localStorage IS the
      # session and the two can never disagree. This one answers the API itself,
      # which is the only way to reach the four ways they can.
      - name: The browser's memory and the server's agree
        run: node tools/session/check.mjs
