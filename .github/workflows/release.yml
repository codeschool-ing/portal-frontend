# The tag and the page have to say the same thing.
#
# The version is written in the repository and the release is checked against
# it, rather than stamped at build time: `bundle.py` produces one artefact and
# the portal is also served from source, so a version that lived only in the
# bundle would give two answers to one question. That trade buys one manual
# step per release (`node tools/version/version.js 1.2.0`); what it must not
# buy is silent drift, which is what this is for.
#
# A wrong version is worse than no version: it answers "what is deployed?" with
# confidence and gets it wrong. So this fails the release rather than warn.

name: release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The version in the portal must equal the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          page="$(node tools/version/version.js --check)"
          echo "tag:  $tag"
          echo "page: $page"
          if [ "$tag" != "$page" ]; then
            echo
            echo "The release is tagged v$tag and the portal says v$page."
            echo "Whoever reads the account screen would be told the wrong thing."
            echo
            echo "Fix it with:  node tools/version/version.js $tag"
            echo "then commit, delete the tag and tag again."
            exit 1
          fi

      # Cheap and browserless, so it can run on every release without a
      # Playwright install. The browser suites stay the local pre-push step.
      - name: Nothing on screen is stuck in English
        run: node tools/i18n/check.mjs
