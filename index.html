<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>codeschool.ing</title>
<meta name="description" content="Área do aluno da codeschool.ing: sua trilha, seus cursos e seus exercícios." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<script>/* applies the saved theme before paint, avoiding the "flash" — same as the vitrine */
try{if(localStorage.getItem('codeschool-tema')==='claro')document.documentElement.dataset.tema='claro'}catch(e){}</script>

<!-- Containers the i18n must NOT map on load: they rebuild themselves from the
     data, calling txt() at render time. In the vitrine this list is the
     exception; here it is nearly the whole page, and that is why it moved out
     of i18n-runtime.js and became configuration — the file stays identical to
     the one over there. -->
<script>window.I18N_DINAMICOS = ['#conteudo', '#trilho', '#nav-contexto', '#conta-menu', '.drop-atual'];</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/base.css" />
<link rel="stylesheet" href="assets/portal.css" />
</head>
<body class="portal-body">

<!-- THE SAME bar as the vitrine: a fixed 64px, brand with LED, theme and
     language. What changed is the middle — the sales links gave way to the
     student's context, and "Área do aluno" stopped being a placeholder: it is
     this page. -->
<nav>
  <a href="#/painel" class="brand">
    <span class="led"></span><span class="brand-nome">codeschool<span class="brand-sep">.</span>ing</span>
  </a>

  <button class="trilho-btn" id="trilho-btn" aria-label="Abrir navegação" aria-expanded="false">≡</button>

  <div class="nav-contexto" id="nav-contexto"></div>

  <div class="nav-acoes">
    <button id="busca-btn" class="nav-icone" aria-label="Buscar curso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </button>

    <button id="tema-btn" class="tema" aria-label="Mudar para tema claro">
      <svg class="ico-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
    </button>

    <div class="idioma" id="idioma">
      <button class="idioma-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Escolher idioma">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
        <span id="idioma-curto">PT</span>
      </button>
      <div class="idioma-menu" id="idioma-menu" role="menu"></div>
    </div>

    <div class="conta" id="conta">
      <button class="conta-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Sua conta">
        <span class="conta-avatar" id="conta-avatar">·</span>
      </button>
      <div class="conta-menu" id="conta-menu" role="menu"></div>
    </div>
  </div>
</nav>

<div class="portal">
  <!-- Rail: answers "where am I" and "how much is left" without a click. It
       becomes a drawer below 1180px, the same cut at which the vitrine's bar
       no longer fitted on one line. -->
  <aside class="trilho" id="trilho" aria-label="Navegação"></aside>
  <div class="trilho-veu" id="trilho-veu" hidden></div>

  <main class="conteudo" id="conteudo" tabindex="-1"></main>
</div>

<!-- catalogue and dictionaries: exactly the vitrine's files, unchanged -->
<script src="assets/dados.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n-cursos-en.js"></script>
<script src="assets/i18n-cursos-es.js"></script>
<script src="assets/i18n-cursos-fr.js"></script>
<script src="assets/i18n-cursos-it.js"></script>
<script src="assets/i18n-runtime.js"></script>
<script src="assets/plans.js"></script>
<script src="assets/materials.js"></script>
<script src="assets/lessons-web-fundamentos.js"></script>
<script src="assets/lessons-html-css.js"></script>
<script src="assets/lessons-javascript.js"></script>
<script src="assets/exercicios-exemplo.js"></script>
<script src="assets/exercicios-web-fundamentos.js"></script>
<script src="assets/exercicios-html-css.js"></script>

<script type="module" src="app/main.js"></script>
</body>
</html>
